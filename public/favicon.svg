<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Suivi des contractions">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d6be"/>
      <stop offset="1" stop-color="#e5826a"/>
    </linearGradient>
    <clipPath id="c">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>
  <!-- Icône "Aube" (design handoff BUR-88) : soleil levant à demi caché par l'horizon,
       même composition que l'icône iOS (ios/.../AppIcon-512@2x.png), à l'échelle 512. -->
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#g)"/>
    <circle cx="256" cy="338" r="123" fill="#fff"/>
    <rect y="338" width="512" height="174" fill="#c9604a"/>
    <rect x="102" y="379" width="307" height="20" rx="10" fill="#fff" fill-opacity=".5"/>
  </g>
</svg>
